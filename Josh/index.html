<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Josh</title>
  <link rel="stylesheet" href="../shared.css">
  <style>
    /* Page-specific color overrides */
    body::before {
      background: rgba(0, 0, 0, 0.45);
    }

    .profile {
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    .pfp {
      border: 3px solid rgba(255, 255, 255, 0.25);
    }

    .music-player {
      background: rgba(137, 207, 240, 0.28);
      border: 1px solid rgba(137, 207, 240, 0.55);
    }

    .music-scrubber {
      background: rgba(255, 255, 255, 0.5);
    }

    .social-link {
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.15);
    }

    .social-link:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.5);
    }

    /* Orange + blue accent colors for Josh */
    .profile {
      border-color: rgba(255, 140, 40, 0.4) !important;
      background: rgba(255, 140, 40, 0.12) !important;
    }
  </style>
</head>
<body>
  <div class="bg-container" id="bgContainer"></div>
  <div class="container">
    <div class="profile" id="profileCard">
      <div class="pfp-wrap">
        <img class="pfp" id="profilePfp" src="" alt="Profile picture">
      </div>
      <h1 id="profileName"></h1>
      <p class="tagline" id="profileBio"></p>

      <div class="social-links" id="socialLinks"></div>

      <div class="music-player" id="musicPlayer">
        <div class="music-top-row">
          <img class="music-art" id="musicArt" src="" alt="" crossorigin="anonymous">
          <div class="music-info">
            <div class="music-title" id="musicTitle">No track loaded</div>
            <div class="music-artist" id="musicArtist"></div>
          </div>
          <div class="music-controls" id="musicControls">
            <button class="music-btn" id="musicPrev" title="Previous track">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="music-btn play-pause" id="musicPlayPause" title="Play/Pause">
              <svg id="playIcon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M8 5v14l11-7z"/></svg>
              <svg id="pauseIcon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button class="music-btn" id="musicNext" title="Next track">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
          </div>
        </div>
        <div class="music-scrub-row" id="musicScrubRow">
          <span class="music-time current" id="musicCurrentTime">0:00</span>
          <input type="range" class="music-scrubber" id="musicScrubber" value="0" min="0" max="100" step="0.1">
          <span class="music-time duration" id="musicDuration">0:00</span>
        </div>
        <audio id="audioEl" preload="metadata"></audio>
        <canvas id="artSampleCanvas" width="10" height="10" style="display:none"></canvas>
      </div>
    </div>
  </div>

  <script src="../shared.js"></script>
  <script>
    const CONFIG = {
      name: "Josh",
      bio: "The one, the only",
      pfpUrl: "../assets/pfp/josh.jpg",
      bgImage: "../assets/bg/josh.jpg",
      bgBlur: 0,
      cardBorderColor: "rgba(255, 140, 40, 0.4)",
      cardBorderWidth: 1,
      cardBorderRadius: 24,
      cardBackground: "rgba(255, 140, 40, 0.12)",
      iconBorderColor: "rgba(255, 140, 40, 0.4)",
      iconBorderWidth: 2,
      iconBackground: "rgba(255, 140, 40, 0.1)",
      playerBorderColor: "rgba(137, 207, 240, 0.55)",
      playerBorderWidth: 1,
      playerBorderRadius: 14,
      playerBackground: "rgba(137, 207, 240, 0.28)",
      playerColorFromArt: true,
      tracks: [
        { title: "Hex", artist: "80purppp", url: "https://archive.org/download/webpage-assets/Josh1.mp3", art: "https://archive.org/download/webpage-assets/Josh1.jpg" },
        { title: "16", artist: "Baby Keem", url: "https://archive.org/download/webpage-assets/Josh2.mp3", art: "https://archive.org/download/webpage-assets/Josh2.jpg" },
        { title: "2055", artist: "Sleepy Hallow", url: "https://archive.org/download/webpage-assets/Josh3.mp3", art: "https://archive.org/download/webpage-assets/Josh3.jpg" }
      ],
      links: [
        { name: "Snapchat", url: "https://snapchat.com/add/joshuaispretty2", icon: "snapchat" },
        { name: "Instagram", url: "https://instagram.com/josh_cant_fly", icon: "instagram" },
        { name: "TikTok", url: "https://www.tiktok.com/@josh_just_felloffa_roof", icon: "tiktok" },
        { name: "PlayStation", url: "https://profile.playstation.com/MrCacti247", icon: "playstation" }
      ]
    };

    window.addEventListener('DOMContentLoaded', async () => {
      await initProfilePage(CONFIG, '../');
    });
  </script>
</body>
</html>
