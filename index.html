<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cxsir</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    /* Page-specific color overrides */
    body::before {
      background: rgba(0, 0, 0, 0.15);
    }

    .pfp {
      border: 3px solid rgba(20, 40, 80, 0.25);
    }

    .social-link:hover {
      background: rgba(20, 40, 80, 0.18) !important;
      border-color: rgba(20, 40, 80, 0.5) !important;
    }

    .showcase-card {
      border: 1px solid rgba(20, 40, 80, 0.12);
    }

    .showcase-card:hover {
      border-color: rgba(20, 40, 80, 0.3);
    }

    .spotify-badge,
    .recently-played-badge {
      background: rgba(20, 40, 80, 0.5);
      color: rgba(207, 224, 255, 1);
      border: 1px solid rgba(207, 224, 255, 0.4);
    }
</style>
</head>
<body>
  <div class="bg-container" id="bgContainer"></div>
  <div class="container">
    <div class="profile" id="profileCard">
      <div class="pfp-wrap">
        <img class="pfp" id="profilePfp" src="" alt="Profile picture">
      </div>
      <h1 id="profileName"></h1>
      <p class="tagline" id="profileBio"></p>

      <div class="social-links" id="socialLinks"></div>

      <div class="music-player" id="musicPlayer">
        <div class="spotify-badge" id="spotifyBadge">Now Playing</div>
        <div class="recently-played-badge" id="recentlyPlayedBadge">Recently Played</div>
        <div class="music-top-row">
          <img class="music-art" id="musicArt" src="" alt="" crossorigin="anonymous">
          <div class="music-info">
            <div class="music-title" id="musicTitle">No track loaded</div>
            <div class="music-artist" id="musicArtist"></div>
          </div>
          <div class="music-controls" id="musicControls">
            <button class="music-btn" id="musicPrev" title="Previous track">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="music-btn play-pause" id="musicPlayPause" title="Play/Pause">
              <svg id="playIcon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M8 5v14l11-7z"/></svg>
              <svg id="pauseIcon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button class="music-btn" id="musicNext" title="Next track">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
          </div>
        </div>
        <div class="music-scrub-row" id="musicScrubRow">
          <span class="music-time current" id="musicCurrentTime">0:00</span>
          <input type="range" class="music-scrubber" id="musicScrubber" value="0" min="0" max="100" step="0.1">
          <span class="music-time duration" id="musicDuration">0:00</span>
        </div>
        <audio id="audioEl" preload="metadata"></audio>
        <canvas id="artSampleCanvas" width="10" height="10" style="display:none"></canvas>
      </div>

      <div class="card-showcase" id="cardShowcase"></div>
    </div>

    <div class="rl-section" id="rlSection">
      <div class="profile rl-card" id="rlCard">
        <div class="rl-header">
          <svg class="rl-platform-icon" id="rlPlatformIcon" role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"></svg>
          <div>
            <h2>Rocket League</h2>
            <div class="rl-username" id="rlUsername"></div>
          </div>
        </div>
        <div id="rlContent">
          <div class="rl-loading" id="rlLoading">Loading stats…</div>
        </div>
        <div class="rl-updated" id="rlUpdated"></div>
      </div>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    const CONFIG = {
      name: "cxsir",

      pfpUrl: "assets/pfp/cxsir.jpg",

      cardBorderColor: "rgba(20, 40, 80, 0.12)",
      cardBorderWidth: 1,
      cardBorderRadius: 24,

      iconBorderColor: "rgba(20, 40, 80, 0.15)",
      iconBorderWidth: 2,
      iconBackground: "rgba(20, 40, 80, 0.08)",
      playerBorderColor: "rgba(20, 40, 80, 0.1)",
      playerBorderWidth: 1,
      playerBorderRadius: 14,
      playerBackground: "rgba(20, 40, 80, 0.55)",
      playerColorFromArt: true,
      exophaseCardUrl: "https://card.exophase.com/2/0/327032.png",
      showcaseBorderColor: "rgba(20, 40, 80, 0.12)",
      showcaseBorderWidth: 1,
      showcaseBorderRadius: 12,
      musicScrubberBg: "rgba(40, 80, 160, 0.5)",
      rlBestMmrBg: "rgba(20, 40, 80, 0.4)",
      rlBestMmrLabelColor: "rgba(168, 184, 216, 1)",
      rlPlaylistCardBg: "rgba(20, 40, 80, 0.35)",
      rlPlaylistNameColor: "rgba(168, 184, 216, 1)",
      rlPlaylistDivisionColor: "rgba(138, 155, 192, 1)",
      rlPlaylistRatingColor: "rgba(138, 155, 192, 1)",
      rlStatBg: "rgba(20, 40, 80, 0.3)",
      rlStatLabelColor: "rgba(138, 155, 192, 1)",
      rlUpdatedColor: "rgba(111, 128, 160, 1)",
      rlUsernameColor: "rgba(168, 184, 216, 1)",
      spotifyWorkerUrl: "https://github-io.cxsir.workers.dev",
      spotifyPollSeconds: 10,
      tracks: [],
      rocketLeagueWorkerUrl: "https://github-io.cxsir.workers.dev/rocketleague",
      rocketLeaguePlayerId: "cxsir",
      rocketLeagueUsername: "I cxsir I",
      links: [
        { name: "Snapchat", url: "https://snapchat.com/add/gangangcuh", icon: "snapchat" },
        { name: "Instagram", url: "https://instagram.com/cxsirr", icon: "instagram" },
        { name: "YouTube", url: "https://youtube.com/@cxsirr", icon: "youtube" },

        { name: "Discord", url: "https://discord.com/users/803306255062007818", icon: "discord" },
        { name: "Roblox", url: "https://roblox.com/users/2242266391/profile", icon: "roblox" },
        { name: "GitHub", url: "https://github.com/cxsirr", icon: "github" },
        { name: "Email", url: "mailto:cxsir@proton.me", icon: "email" }
      ]
    };
    window.addEventListener('DOMContentLoaded', async () => {
      await initProfilePage(CONFIG, '');
      if (CONFIG.rocketLeagueWorkerUrl) {
        await fetchRocketLeagueStats(CONFIG);
      }
    });
  </script>
</body>
</html>
