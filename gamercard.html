<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playtime</title>
<link rel="stylesheet" href="shared.css">
<style>
  body::before { background: rgba(0, 0, 0, 0.15); }
  .pt-wrap { max-width: 420px; margin: 0 auto; padding: 20px; }
  .profile, .rl-card { background: rgba(20, 40, 80, 0.25); border: 1px solid rgba(20, 40, 80, 0.12); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35); }
  .rl-best-mmr { background: rgba(20, 40, 80, 0.4); }
  .rl-best-mmr .label { color: #a8b8d8; }
  .rl-best-mmr .value { color: #ffffff; }
  .rl-stat { background: rgba(20, 40, 80, 0.3); }
  .rl-stat .value { color: #ffffff; }
  .rl-stat .label { color: #8a9bc0; }
  .rl-updated { color: #6f80a0; }
</style>
</head>
<body>
  <div class="bg-container"></div>
  <div class="pt-wrap">
    <div class="profile rl-card" id="ptCard">
      <div class="rl-loading">Loading playtime…</div>
    </div>
  </div>

<script>
  const WORKER_URL = "https://github-io.cxsir.workers.dev/gamercard";

  async function load() {
    const card = document.getElementById("ptCard");
    try {
      const res = await fetch(WORKER_URL);
      if (!res.ok) throw new Error(`Worker responded ${res.status}`);
      const data = await res.json();

      card.innerHTML = `
        <div class="rl-best-mmr" style="margin-bottom:16px;">
          <div class="label">Combined PSN Playtime</div>
          <div class="value">${data.totalHoursPlayed.toLocaleString()} hrs</div>
        </div>
        <div class="rl-overview-grid">
          <div class="rl-stat">
            <div class="value">${data.accountA.ok ? data.accountA.hoursPlayed.toLocaleString() : "—"}</div>
            <div class="label">Account A</div>
          </div>
          <div class="rl-stat">
            <div class="value">${data.accountB.ok ? data.accountB.hoursPlayed.toLocaleString() : "—"}</div>
            <div class="label">Account B</div>
          </div>
        </div>
      `;
    } catch (err) {
      card.innerHTML = `<div class="rl-loading">Couldn't load playtime: ${err.message}</div>`;
    }
  }
  window.addEventListener("DOMContentLoaded", load);
</script>
</body>
</html>
