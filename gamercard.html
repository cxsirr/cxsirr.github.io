<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamercard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/3.4.1/tailwind.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #e9ecf5;
    --ink-dim: #8b93a7;
    --panel: #14141b;
    --panel-alt: #0e0e13;
    --hairline: rgba(255,255,255,0.08);
    --amber: #ffb020;
  }
  body { background: #0a0a0f; font-family: 'Inter', sans-serif; }
  .font-display { font-family: 'Rajdhani', sans-serif; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }

  .card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--hairline);
    overflow: hidden;
    isolation: isolate;
  }

  /* diagonal brand stripe — the signature element, repeated across every
     card regardless of platform color, so the grid reads as one system */
  .brand-stripe {
    position: absolute;
    top: 0; right: 0;
    width: 130px; height: 130px;
    clip-path: polygon(100% 0, 100% 100%, 30% 0);
    opacity: 0.16;
    z-index: 0;
  }

  .hex-badge {
    clip-path: polygon(25% 6%, 75% 6%, 100% 50%, 75% 94%, 25% 94%, 0% 50%);
    display: flex; align-items: center; justify-content: center;
  }

  .xp-track { background: var(--panel-alt); border: 1px solid var(--hairline); }
  .xp-fill { background: linear-gradient(90deg, var(--amber), #ffd27a); transition: width 0.8s cubic-bezier(.16,1,.3,1); }

  .skeleton { background: linear-gradient(90deg, #17171f 25%, #1e1e28 37%, #17171f 63%); background-size: 400% 100%; animation: shimmer 1.4s infinite; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
</style>
</head>
<body class="min-h-screen py-10 px-4">

  <div class="max-w-5xl mx-auto">

    <!-- SUMMARY BAR -->
    <div class="font-display text-3xl font-700 text-[var(--ink)] mb-1 tracking-wide">GAMERCARD</div>
    <div id="summaryBar" class="card rounded-lg p-5 mb-8 grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="skeleton h-14 rounded col-span-2 md:col-span-4"></div>
    </div>

    <!-- CARD GRID -->
    <div id="cardGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- skeleton placeholders while loading -->
      <div class="card rounded-lg h-32 skeleton"></div>
      <div class="card rounded-lg h-32 skeleton"></div>
      <div class="card rounded-lg h-32 skeleton"></div>
      <div class="card rounded-lg h-32 skeleton"></div>
    </div>

    <div id="errorBox" class="hidden mt-6 text-sm text-red-400 font-mono"></div>
  </div>

<script>
  // Point this at wherever you deploy gamercard-worker.js — either its own
  // worker, or a new route on your existing worker (e.g. add "/gamercard").
  const WORKER_URL = "https://github-io.cxsir.workers.dev/gamercard";

  const PLATFORM_META = {
    psn:               { name: "PlayStation",       color: "#0070d1" },
    xbox:              { name: "Xbox",              color: "#107c10" },
    epic:              { name: "Epic Games",        color: "#c0c0c0" },
    ubisoft:           { name: "Ubisoft Connect",   color: "#0084ff" },
    eaplay:            { name: "EA Play",           color: "#ff4747" },
    steam:             { name: "Steam",              color: "#66c0f4" },
    googlePlayGames:   { name: "Google Play Games", color: "#4285f4" },
    retroachievements: { name: "RetroAchievements", color: "#ffb020" },
    gog:               { name: "GOG",                color: "#a24fd6" },
  };

  function el(tag, className, html) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function renderSummary(summary) {
    const bar = document.getElementById("summaryBar");
    bar.innerHTML = "";
    const items = [
      { label: "Accounts Tracked", value: summary.accountsOk + " / " + summary.accountsTracked },
      { label: "Achievements", value: summary.totalAchievementsUnlocked.toLocaleString() + " / " + summary.totalAchievementsPossible.toLocaleString() },
      { label: "Combined Completion", value: summary.combinedCompletionPercent + "%" },
      { label: "Average Level", value: summary.averageLevel ?? "—" },
    ];
    items.forEach((item) => {
      const cell = el("div", "");
      cell.appendChild(el("div", "font-mono text-2xl font-600 text-[var(--ink)]", item.value));
      cell.appendChild(el("div", "text-xs uppercase tracking-wider text-[var(--ink-dim)] mt-1", item.label));
      bar.appendChild(cell);
    });
  }

  function renderCard(account) {
    const meta = PLATFORM_META[account.platform] || { name: account.platform, color: "#888" };
    const card = el("div", "card rounded-lg p-4 flex gap-4");

    const stripe = el("div", "brand-stripe");
    stripe.style.background = meta.color;
    card.appendChild(stripe);

    // avatar + hex level badge
    const left = el("div", "relative flex-shrink-0 z-[1]");
    const avatar = el("img", "w-14 h-14 rounded object-cover border border-[var(--hairline)]");
    avatar.src = account.avatarUrl;
    avatar.alt = account.username;
    left.appendChild(avatar);

    if (account.level !== null && account.level !== undefined) {
      const badge = el("div", "hex-badge absolute -bottom-2 -right-2 w-7 h-7 font-mono text-[10px] font-600 text-black");
      badge.style.background = meta.color;
      badge.textContent = account.level;
      left.appendChild(badge);
    }
    card.appendChild(left);

    // main content
    const main = el("div", "flex-1 min-w-0 z-[1]");

    const header = el("div", "flex items-center justify-between gap-2 mb-1");
    header.appendChild(el("div", "font-display text-lg font-600 text-[var(--ink)] truncate", account.username));
    const tag = el("div", "text-[10px] uppercase tracking-wider font-600 px-2 py-0.5 rounded-full flex-shrink-0");
    tag.style.color = meta.color;
    tag.style.border = `1px solid ${meta.color}55`;
    tag.textContent = meta.name;
    header.appendChild(tag);
    main.appendChild(header);

    const pct = account.achievementsTotal
      ? Math.round((account.achievementsUnlocked / account.achievementsTotal) * 100)
      : 0;

    const statRow = el("div", "flex items-center justify-between text-xs font-mono text-[var(--ink-dim)] mb-1");
    statRow.appendChild(el("span", "", `${account.achievementsUnlocked.toLocaleString()} / ${account.achievementsTotal.toLocaleString()} unlocked`));
    statRow.appendChild(el("span", "text-[var(--ink)] font-600", `${pct}%`));
    main.appendChild(statRow);

    const track = el("div", "xp-track w-full h-1.5 rounded-full overflow-hidden mb-2");
    const fill = el("div", "xp-fill h-full rounded-full");
    fill.style.width = "0%";
    track.appendChild(fill);
    main.appendChild(track);
    requestAnimationFrame(() => { fill.style.width = pct + "%"; });

    if (account.recentGame) {
      const recent = el("div", "text-xs text-[var(--ink-dim)] truncate");
      recent.textContent = `Recently playing: ${account.recentGame.name}`;
      main.appendChild(recent);
    }

    card.appendChild(main);
    return card;
  }

  async function loadGamercard() {
    const grid = document.getElementById("cardGrid");
    const errorBox = document.getElementById("errorBox");
    try {
      const res = await fetch(WORKER_URL);
      if (!res.ok) throw new Error(`Worker responded ${res.status}`);
      const data = await res.json();

      renderSummary(data.summary);

      grid.innerHTML = "";
      data.accounts.forEach((account) => {
        if (account.ok) grid.appendChild(renderCard(account));
      });
    } catch (err) {
      errorBox.textContent = "Couldn't load gamercard data: " + err.message;
      errorBox.classList.remove("hidden");
    }
  }

  window.addEventListener("DOMContentLoaded", loadGamercard);

  // Report height to a parent page if this file is embedded via <iframe>,
  // so the iframe can auto-resize instead of showing scrollbars or gaps.
  function reportHeight() {
    if (window.parent !== window) {
      window.parent.postMessage({ type: "gamercard-height", height: document.documentElement.scrollHeight }, "*");
    }
  }
  window.addEventListener("load", reportHeight);
  new ResizeObserver(reportHeight).observe(document.body);
</script>
</body>
</html>
